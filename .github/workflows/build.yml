name: Build CI

# Verifikasi otomatis: setiap push harus lolos production build.
# Bila Vercel gagal deploy, lihat log di sini untuk mengetahui apakah
# masalahnya di kode (CI gagal) atau di lingkungan Vercel (CI sukses).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/motomate
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/motomate
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bunx next build
